weather:
    weatherwidgetio:
        # Beispiel-Widget; eigenen Code unter https://weatherwidget.io/ für den gewünschten Ort erzeugen
        htmlcode: |-
            <a class="weatherwidget-io" href="https://forecast7.com/en/0d0d0/musterstadt/" data-label_1="MUSTERSTADT" data-label_2="WEATHER" data-theme="original" >MUSTERSTADT WEATHER</a>
            <script>
            !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
            </script>
    windy:
        # Beispiel-URL, lat/lon/location gemäss https://www.windy.com/ auf den eigenen Ort anpassen
        htmlcode: <iframe width="650" height="450" src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=default&metricTemp=default&metricWind=default&zoom=9&overlay=radar&product=radar&level=surface&lat=0&lon=0" frameborder="0"></iframe>
